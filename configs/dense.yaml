# GĐ2 — nhánh vector (MedCPT bi-encoder)
model:
  query_encoder:   ncbi/MedCPT-Query-Encoder
  article_encoder: ncbi/MedCPT-Article-Encoder
  # Hai checkpoint phải đi cùng nhau (cùng không gian vector).

embedding:
  dim: 768
  article_max_length: 512     # title + abstract
  query_max_length: 64        # MedCPT Query-Encoder huấn luyện với 64
  normalize_l2: true          # bắt buộc: IP = cos chỉ khi đã chuẩn hoá

index:
  type: IndexFlatIP           # KHÔNG có bước train
  path: indexes/faiss/articles.faiss

encode:
  batch_size: 64              # RTX 3080 10 GB + fp16: 64 ổn; hết VRAM thì giảm 32
  chunk_size: 4096            # số bài mỗi chunk lưu đĩa (để chạy tiếp được khi bị ngắt)
  fp16: true                  # chỉ có tác dụng trên CUDA
  device: auto

top_k: 1000
